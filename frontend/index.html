<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เข้าสู่ระบบ | ARAMS</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="login-page">

  <div class="login-shell">
    <div class="login-brand">
      <div class="emblem"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1>ระบบบริหารงานทะเบียนและวัดผล</h1>
      <p>Academic Registration and Assessment Management System</p>
      <div class="system-tag">ARAMS · ระบบสำหรับบุคลากรทางการศึกษา นักเรียน และผู้ปกครอง</div>
    </div>

    <div class="login-form-area">
      <h2>เข้าสู่ระบบ</h2>
      <p class="sub">กรอกชื่อผู้ใช้และรหัสผ่านของท่านเพื่อเข้าใช้งานระบบ</p>

      <div class="form-error" id="formError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">ชื่อผู้ใช้</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" autocomplete="username" required />
          </div>
        </div>
        <div class="field">
          <label for="password">รหัสผ่าน</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>เข้าสู่ระบบ</span>
        </button>
      </form>

      <div class="login-footnote">© ระบบบริหารงานทะเบียนและวัดผล (ARAMS)</div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
